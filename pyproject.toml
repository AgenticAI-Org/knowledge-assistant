[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "huggingface-hub<0.26",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.0.0",
    "numpy<2",
    "openai>=1.0.0",
    "onnxruntime==1.23.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers<3",
    "streamlit>=1.62.0",
    "tenacity>=8.0.0",
    "tiktoken>=0.14.0",
    "torch==2.2.2",
    "transformers<4.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "reportlab>=5.0.1",
]

[tool.ty.environment]
root = ["."]

[tool.pyright]
include = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
